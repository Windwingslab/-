<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>MotionHub Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="css/style.css?v=3.4.4">
    <link rel="stylesheet" href="css/studio.css?v=3.4.4">
</head>
<body class="studio">
    <header class="top">
        <div class="brand"><i class="mark"></i><span>MOTIONHUB</span><em>Studio · 剪辑排版 · v3.4.4</em></div>
        <div class="top-acts">
            <span class="size-label mono" id="size-label"></span>
            <button class="btn accent sm live-btn" id="btn-live"><span class="ico" data-icon="star"></span><span>导出实况</span></button>
            <button class="icon-btn" id="btn-accent" data-icon="colors"></button>
        </div>
        <div class="top-prog" id="top-prog"><i></i></div>
    </header>

    <div class="studio-body">
        <!-- 左：素材 -->
        <aside class="col left">
            <div class="sec-head"><span class="num">(01) — CLIPS</span><span class="zh" id="clip-count">素材</span></div>
            <div class="clip-list" id="clip-list"></div>
            <button class="btn accent wide" id="add-clips"><span class="ico" data-icon="plus"></span>添加视频</button>
            <button class="btn wide" id="add-comp"><span class="ico" data-icon="precomp"></span>导入 AE 合成</button>
            <p class="drop-tip">先在画面里点选一个格子，再点这里的素材放进去，放好会自动跳到下一个空格子。也可以把视频文件直接拖进来，或把素材拖到格子上。</p>
        </aside>

        <!-- 中：预览 + 时间线 -->
        <section class="col center">
            <div class="stage" id="stage"><canvas id="view"></canvas><div class="stage-empty" id="stage-empty">添加视频后在这里预览排版</div></div>
            <div class="transport">
                <button class="icon-btn" id="btn-play" data-icon="play"></button>
                <span class="mono t" id="t-now">0.00</span><span class="mono muted">/</span><span class="mono t muted" id="t-total">0.00 s</span>
                <span class="sp"></span>
                <span class="muted cell-info" id="cell-info"></span>
                <button class="btn sm" id="btn-cover"><span class="ico" data-icon="star"></span><span>设为封面</span></button>
            </div>
            <div class="otl" id="otl">
                <div class="trim-head"><span class="num mono">OUTPUT · 成片</span><span class="muted" id="otl-info"></span></div>
                <div class="otl-bar" id="otl-bar"><i class="otl-fill" id="otl-fill"></i><i class="otl-ph" id="otl-ph"></i><b class="otl-cover" id="otl-cover"></b></div>
            </div>
            <div class="trim" id="trim">
                <div class="trim-head"><span class="num mono" id="trim-title">TRIM · 本格裁切</span><span class="muted" id="trim-info">选中一个格子后在这里裁切它的素材</span></div>
                <div class="track" id="track"><canvas id="strip"></canvas><div class="range" id="range"><i class="h in"></i><i class="h out"></i></div><div class="ph" id="ph"></div></div>
            </div>
        </section>

        <!-- 右：排版 / 调色 / 导出 -->
        <aside class="col right">
            <nav class="tabs" id="stabs">
                <button data-tab="layout" class="tab on">排版</button>
                <button data-tab="grade" class="tab">调色</button>
                <button data-tab="export" class="tab">导出</button>
            </nav>
            <div class="spage on" id="sp-layout"></div>
            <div class="spage" id="sp-grade"></div>
            <div class="spage" id="sp-export"></div>
        </aside>
    </div>

    <footer class="hint" id="hint"></footer>
    <div class="drop-overlay" id="drop-overlay" hidden><div>松开鼠标，添加视频</div></div>
    <div class="pop" id="pop" hidden></div>
    <div class="modal" id="modal" hidden>
        <div class="dialog">
            <div class="dlg-title" id="dlg-title"></div>
            <div class="dlg-body" id="dlg-body"></div>
            <div class="dlg-btns" id="dlg-btns"></div>
        </div>
    </div>

    <script src="js/icons.js?v=3.4.4"></script>
    <script src="js/grade.js?v=3.4.4"></script>
    <script src="js/gif.js?v=3.4.4"></script>
    <script src="js/livephoto.js?v=3.4.4"></script>
    <script src="js/studio.js?v=3.4.4"></script>
</body>
</html>
